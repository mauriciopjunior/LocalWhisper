<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
      font-size: 12px;
      color: #ddd;
      padding: 12px;
      margin: 0;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }

    label {
      display: block;
      margin: 10px 0 3px;
      color: #aaa;
    }

    sp-textfield,
    sp-picker,
    input[type=text],
    input[type=number] {
      width: 100%;
      box-sizing: border-box;
    }

    input[type=text],
    input[type=number],
    select {
      background: #2b2b2b;
      background-color: #2b2b2b;
      background-image: none;
      color: #eee;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 4px 6px;
      margin: 0;
      height: 28px;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      box-sizing: border-box;
    }

    input[type=text]:focus,
    input[type=number]:focus,
    select:focus {
      border-color: #4b8cff;
      outline: none;
      box-shadow: none;
    }

    input[type=checkbox] {
      width: auto;
      margin: 0 6px 0 0;
    }

    label input[type=checkbox] {
      vertical-align: middle;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 12px;
    }

    .row>* {
      flex: 1;
    }

    button {
      margin-top: 10px;
      width: 100%;
    }

    #bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
    }

    #fill {
      height: 100%;
      width: 0;
      background: #4b8cff;
      transition: width .3s;
    }

    #status {
      margin-top: 8px;
      min-height: 16px;
    }

    #status.err {
      color: #ff6b6b;
    }

    #status.ok {
      color: #6bd66b;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: #888;
      margin-right: 5px;
    }

    .dot.on {
      background: #4cd964;
    }

    .dot.off {
      background: #ff5a5a;
    }
  </style>
</head>

<body>
  <h1>Whisper Local</h1>
  <div id="server"><span class="dot" id="dot"></span><span id="srvText">Verificando servidor…</span></div>
  <button id="btnStart" style="display:none">Iniciar servidor</button>

  <label>Origem</label>
  <div class="row">
    <button id="btnSel" style="margin:0">Usar seleção</button>
  </div>
  <input type="text" id="media" placeholder="Caminho do arquivo de mídia">

  <label>Modelo</label>
  <select id="model" style="width:100%">
    <option>Tiny</option>
    <option>Base</option>
    <option>Small</option>
    <option>Medium</option>
    <option>Large</option>
    <option selected>Turbo</option>
  </select>

  <label>Idioma (ex.: Portuguese, English)</label>
  <input type="text" id="lang" value="Portuguese">

  <label>Palavras por legenda</label>
  <input type="number" id="maxWords" value="7" min="1">

  <label>Quebra de linha na palavra nº</label>
  <input type="number" id="breakAt" value="4" min="1">

  <label><input type="checkbox" id="useRange" checked> Só entre os pontos de entrada e saída</label>
  <label><input type="checkbox" id="import" checked> Importar SRT no projeto</label>

  <button id="btnGo">Transcrever</button>
  <div id="bar">
    <div id="fill"></div>
  </div>
  <div id="status"></div>
  <script src="index.js"></script>
</body>

</html>
